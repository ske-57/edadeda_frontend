<div class="page">
    <main class="content">
        <h2 class="title">Корзина</h2>

        <!-- Пустое состояние -->
        <ng-template #emptyState>
            <section class="empty">
                <img class="empty-icon" src="assets/edadeda.logo.png" alt="Пусто" />
                <h3>Корзина пуста</h3>
                <p class="empty-text">Добавьте товары из списка, чтобы оформить заказ.</p>
                <a class="pill" routerLink="/items">
                    <img class="icon-img" src="assets/world.png" alt="" />
                    <span class="pill-text">Перейти к товарам</span>
                </a>
            </section>
        </ng-template>

        <!-- Список товаров в корзине -->
        <section class="cart-list" *ngIf="cartItems?.length; else emptyState">
            <article class="cart-item" *ngFor="let item of cartItems">
                <img class="thumb" [src]="item.image_path || 'assets/edadeda.logo.png'" [alt]="item.title" />

                <div class="info">
                    <header class="head">
                        <h3 class="item-title">{{ item.title }}</h3>
                        <span class="status" *ngIf="item.status" [ngClass]="{
                'status-available': item.status.toLowerCase() === 'available',
                'status-reserved':  item.status.toLowerCase() === 'reserved',
                'status-sold':      item.status.toLowerCase() === 'closed'
              }">
                            {{ item.status }}
                        </span>
                    </header>

                    <p class="desc" *ngIf="item.description">{{ item.description }}</p>

                    <div class="row">
                        <!-- <div class="qty-control" role="group" aria-label="Количество"> -->
                        <!-- <button class="qty-btn" type="button" aria-label="Убавить">−</button> -->
                        <!-- <input class="qty-input" type="number" min="1" inputmode="numeric"
                                aria-label="Количество товара" /> -->
                        <!-- <button class="qty-btn" type="button" aria-label="Добавить">+</button> -->
                        <!-- </div> -->

                        <button class="remove-btn" type="button">Удалить</button>
                    </div>
                </div>

                <div class="line-price">
                    {{ item.price| currency:'RUB ' }}
                </div>
            </article>
        </section>

        <!-- Итоги -->
        <section class="summary-card" *ngIf="cartItems?.length">
            <!-- <div class="sum-row">
                <span>Товары</span>
                <span class="value">{{ 10000 | currency:'RUB '}}</span>
            </div>
            <div class="sum-row">
                <span>Доставка</span>
                <span class="value accent">Бесплатно</span>
            </div> -->
            <!-- <div class="divider"></div> -->
            <div class="sum-row total">
                <span>Итого</span>
                <span class="value">{{ total | currency:'RUB ' }}</span>
            </div>

            <!-- <div class="promo">
                <input class="promo-input" type="text" placeholder="Промокод" />
                <button class="btn secondary" type="button">Применить</button>
            </div> -->
        </section>
    </main>
</div>
